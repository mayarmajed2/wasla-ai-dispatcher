services:
  - type: web
    name: restaurant-ai-dispatcher
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-ai-db
          property: connectionString
      - key: META_VERIFY_TOKEN
        generateValue: true

databases:
  - name: restaurant-ai-db
    plan: starter
