# Legacy path mirror — authoritative Render Free blueprint is at repository root (/render.yaml)
services:
  - type: web
    name: wasla-moka-ai
    runtime: docker
    dockerfilePath: ../Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
