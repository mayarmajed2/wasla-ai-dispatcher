name: Wasla AI CI & PostgreSQL Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla_ci_password
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wasla -d wasla_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies + CPU PyTorch/PEFT (zero paid APIs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security check — verify no .env or committed API/DB secrets
        run: |
          test ! -f .env
          ! git grep -E "(AIzaSy[0-9A-Za-z_-]{30,}|gsk_[0-9A-Za-z]{30,}|EAA[0-9A-Za-z]{40,}|[0-9]{8,10}:AA[0-9A-Za-z_-]{30,}|npg_[0-9A-Za-z]{8,})"

      - name: Dataset & Model artifact integrity verification
        run: |
          python -c "import json; d=json.load(open('menu/menu.json', encoding='utf-8')); assert len(d['products'])==145; print('Menu OK: 145 products')"
          python -c "lines=open('datasets/evaluation/independent_challenge_200.jsonl', encoding='utf-8').read().splitlines(); assert len(lines)>=200; print('Independent benchmark OK:', len(lines))"
          test -f training/checkpoints/camelbert-wasla-lora-v2/adapter_model.safetensors
          test -f training/checkpoints/camelbert-wasla-lora-v2/adapter_config.json

      - name: Frontend syntax & zero-simulator production check
        run: |
          node --check dashboard/assets/app.js
          ! grep -q "محاكي الوكيل الذكي" dashboard/index.html

      - name: Run full regression & AI evaluation suite
        env:
          PYTHONPATH: ".:backend"
          APP_ENV: development
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          META_ACCESS_TOKEN: ""
        run: |
          python -m pytest -v tests/ wasla_phase_a_repro_tests.py backend/test_cart_calculator.py

      - name: Execute REAL PostgreSQL 16 Alembic migrations (0001 -> 0003), persistence & backup/restore verification
        env:
          PYTHONPATH: ".:backend"
          DATABASE_URL: postgresql+psycopg://wasla:wasla_ci_password@localhost:5432/wasla_test
        run: |
          python scripts/verify_postgres_live.py --output reports/ci_postgres_verification.json
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head

  docker-production-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla_ci_password
          POSTGRES_DB: wasla_prod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wasla -d wasla_prod_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency (httpx)
        run: python -m pip install --quiet httpx

      - name: Build production Docker image
        run: docker build -t wasla-prod:ci .

      - name: Boot production Docker container against PostgreSQL 16 & verify restart survival
        run: |
          docker run -d --name wasla-prod --network host \
            -e APP_ENV=production \
            -e DATABASE_URL=postgresql://wasla:wasla_ci_password@127.0.0.1:5432/wasla_prod_test \
            -e AUTH_SECRET_KEY=ci_prod_verification_auth_secret_key_min_32_chars_long \
            -e BOOTSTRAP_ADMIN_USERNAME=ciadmin \
            -e BOOTSTRAP_ADMIN_PASSWORD=CiProdPassword2026! \
            -e SCHEDULER_CRON_SECRET=ci_scheduler_secret_token \
            -e META_VERIFY_TOKEN=ci_meta_verify_token \
            -e META_APP_SECRET=ci_meta_app_secret_key \
            -e DASHBOARD_PUBLIC_URL=https://wasla-moka-ai.onrender.com \
            wasla-prod:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/ready | grep -q '"database_connected":true'; then
              echo "Container ready on attempt $i"
              break
            fi
            sleep 1
          done
          docker logs wasla-prod

          python scripts/verify_whatsapp_e2e_live.py \
            --base-url http://127.0.0.1:7860 \
            --verify-token ci_meta_verify_token \
            --app-secret ci_meta_app_secret_key \
            --admin-user ciadmin \
            --admin-pass CiProdPassword2026! \
            --cron-secret ci_scheduler_secret_token \
            --output reports/ci_docker_prod_verification.json

          echo "Restarting container to verify PostgreSQL persistence & zero data loss..."
          docker restart wasla-prod
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/ready | grep -q '"database_connected":true'; then
              echo "Container recovered after restart on attempt $i"
              break
            fi
            sleep 1
          done

          python scripts/verify_whatsapp_e2e_live.py \
            --base-url http://127.0.0.1:7860 \
            --verify-token ci_meta_verify_token \
            --app-secret ci_meta_app_secret_key \
            --admin-user ciadmin \
            --admin-pass CiProdPassword2026! \
            --cron-secret ci_scheduler_secret_token

          docker rm -f wasla-prod || true
