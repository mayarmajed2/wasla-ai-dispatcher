name: Deploy Wasla AI to Hugging Face Staging Space

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Confirm HF_STAGING_SPACE_ID targets a staging Space, not production"
        required: true
        type: boolean
        default: false

jobs:
  deploy-hf-space:
    runs-on: ubuntu-latest
    environment: env
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_STAGING_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_STAGING_SPACE_ID }}
      CONFIRM_STAGING: ${{ inputs.confirm_staging }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate staging target configuration
        run: |
          set -euo pipefail
          if [ "$CONFIRM_STAGING" != "true" ]; then
            echo "::error::Confirm that HF_STAGING_SPACE_ID targets staging before deploying."
            exit 1
          fi
          missing=0
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing GitHub Environment secret HF_STAGING_TOKEN."
            missing=1
          fi
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Missing GitHub Environment variable HF_STAGING_SPACE_ID."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Stage & upload runtime bundle to the confirmed staging Space
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub
          mkdir -p /tmp/hf_stage
          cp deploy/hf_app.py /tmp/hf_stage/app.py
          cp deploy/hf_requirements.txt /tmp/hf_stage/requirements.txt
          cp deploy/hf_packages.txt /tmp/hf_stage/packages.txt
          cp deploy/hf_space_README.md /tmp/hf_stage/README.md
          cp -r ai_service backend dashboard menu scripts /tmp/hf_stage/
          mkdir -p /tmp/hf_stage/training
          cp -r training/checkpoints /tmp/hf_stage/training/
          find /tmp/hf_stage -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"].strip())
          space_id = os.environ["HF_SPACE_ID"].strip()
          api.upload_folder(
              folder_path="/tmp/hf_stage",
              repo_id=space_id,
              repo_type="space",
              commit_message="Deploy Wasla AI staging bundle",
              delete_patterns=["*.py", "*.txt", "*.md", "ai_service/**", "backend/**", "dashboard/**", "menu/**", "scripts/**", "training/**", "Dockerfile"],
          )
          print(f"Uploaded cleanly to Hugging Face Space: https://huggingface.co/spaces/{space_id}")
          EOF
