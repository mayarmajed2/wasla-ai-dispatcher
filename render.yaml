services:
  - type: web
    name: wasla-moka-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RESTAURANT_TIMEZONE
        value: Africa/Cairo
      - key: DASHBOARD_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_SERVICE_API_KEY
        sync: false
      - key: DELIVERY_DEFAULT_FEE
        value: "20.00"
      - key: DELIVERY_FREE_ZONE
        value: free_zone
      - key: DELIVERY_FREE_ZONE_FEE
        value: "0.00"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: SCHEDULER_CRON_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v27.0
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: UPSELL_ENABLED
        value: "true"
      - key: COMPLAINT_ESCALATION_ENABLED
        value: "true"
      - key: META_BILLABLE_MESSAGES_AUTHORIZED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CASHIER_TELEGRAM_CHAT_ID
        sync: false
      - key: RESTAURANT_OWNER_TELEGRAM_CHAT_ID
        sync: false
