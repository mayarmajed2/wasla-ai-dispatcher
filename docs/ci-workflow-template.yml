# Wasla AI — Production CI/CD Pipeline (with Real PostgreSQL 16 Service Container)
# To activate on GitHub Actions (requires `workflow` token scope):
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows
#   cp docs/ci-workflow-template.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "ci: activate GitHub Actions with PostgreSQL 16" && git push

name: Wasla AI CI & PostgreSQL Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla_ci_password
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wasla -d wasla_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (zero paid API calls in CI)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security check — verify no .env or hardcoded API keys committed
        run: |
          test ! -f .env
          ! git grep -E "(AIzaSy[0-9A-Za-z_-]{30,}|gsk_[0-9A-Za-z]{30,}|EAA[0-9A-Za-z]{40,})"

      - name: Dataset & Model artifact integrity verification
        run: |
          python -c "import json; d=json.load(open('menu/menu.json', encoding='utf-8')); assert len(d['products'])==145; print('Menu OK: 145 products')"
          python -c "lines=open('datasets/evaluation/independent_challenge_200.jsonl', encoding='utf-8').read().splitlines(); assert len(lines)>=200; print('Independent benchmark OK:', len(lines))"
          test -f training/checkpoints/camelbert-wasla-lora-v2/adapter_model.safetensors
          test -f training/checkpoints/camelbert-wasla-lora-v2/adapter_config.json

      - name: Frontend syntax & zero-simulator production check
        run: |
          node --check dashboard/assets/app.js
          ! grep -q "محاكي الوكيل الذكي" dashboard/index.html

      - name: Run unit & mocked integration regression tests
        env:
          APP_ENV: development
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          META_ACCESS_TOKEN: ""
        run: |
          pytest -v tests/ backend/test_cart_calculator.py

      - name: Execute REAL PostgreSQL 16 Alembic migrations (0001 -> 0003) & full persistence verification
        env:
          DATABASE_URL: postgresql+psycopg://wasla:wasla_ci_password@localhost:5432/wasla_test
        run: |
          python scripts/verify_postgres_live.py --output reports/ci_postgres_verification.json
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
